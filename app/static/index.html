<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>License Plate Detection</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header>
  <div class="brand">
    <span class="brand-mark">License Plate Detection</span>
  </div>
  <div style="display:flex; align-items:center; gap:1rem;">
    <a href="/admin" id="admin-link" style="display:none; color:var(--muted); text-decoration:none; font-size:0.85rem;">Registered plates</a>
    <div class="status" id="connection-status">
      <span class="status-dot"></span>
      <span class="status-label">Connecting…</span>
    </div>
  </div>
</header>
<main>
  <div class="video-column" id="video-column">
    <p class="empty-state">Loading cameras…</p>
  </div>
  <section class="panel captures-panel">
    <div class="panel-header">
      <h2>Captures</h2>
      <span class="count-badge" id="captures-count">0</span>
    </div>
    <div id="captures-grid" class="captures-grid">
      <p class="empty-state">Captured plates will appear here.</p>
    </div>
  </section>
  <section class="panel log-panel">
    <div class="panel-header">
      <h2>Detections</h2>
      <span class="count-badge" id="detections-count">0</span>
    </div>
    <div class="table-scroll">
      <table id="detections-table">
        <thead>
          <tr>
            <th>Time</th>
            <th>Camera</th>
            <th>Plate</th>
            <th>Confidence</th>
            <th>Color</th>
            <th>Type</th>
          </tr>
        </thead>
        <tbody id="detections-body"></tbody>
      </table>
      <p class="empty-state" id="detections-empty">Waiting for the first detection…</p>
    </div>
  </section>
</main>
<script src="/static/app.js?v=12"></script>
</body>
</html>
