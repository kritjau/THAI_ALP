<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Registered Plates</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/style.css?v=8" />
<style>
  .add-form {
    display: flex;
    gap: 0.6rem;
    padding: 1rem 1.1rem;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .add-form input {
    flex: 1;
    min-width: 140px;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.5rem 0.7rem;
    color: var(--text);
    font-size: 0.9rem;
  }
  .add-form button, .remove-btn {
    background: var(--accent-dim);
    color: var(--accent);
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 0.5rem 0.9rem;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background 0.15s ease, opacity 0.15s ease;
  }
  .add-form button:hover:not(:disabled) {
    background: rgba(74, 222, 128, 0.25);
  }
  .add-form button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .remove-btn {
    background: transparent;
    color: var(--danger);
    padding: 0.3rem 0.6rem;
  }
  .remove-btn:hover:not(:disabled) { border-color: var(--danger); }
  .remove-btn:disabled { opacity: 0.5; cursor: default; }
  .back-link { color: var(--muted); text-decoration: none; font-size: 0.85rem; }
  .back-link:hover { color: var(--text); }
  /* Same layout as the detection page: the gate camera feed and the
     Registered panel sit side by side in the shared <main> grid (see
     style.css), Gate Activity spans the full width below it the way the
     stats row does there. */
  .admin-panel .table-scroll { min-height: 0; }
  .gate-camera-empty { align-self: start; }
  .gate-activity-panel { margin: 0 1.75rem 2rem; }
  .form-error {
    margin: 0 1.1rem 0.9rem;
    padding: 0.5rem 0.7rem;
    background: rgba(248, 113, 113, 0.12);
    border: 1px solid rgba(248, 113, 113, 0.3);
    border-radius: 8px;
    color: var(--danger);
    font-size: 0.8rem;
  }
  .gate-activity-panel .table-scroll { min-height: 0; }
  .gate-open-tag {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #0b0d12;
    background: var(--accent);
    padding: 0.1rem 0.4rem;
    border-radius: 999px;
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="brand-mark">Registered Plates</span>
  </div>
  <div class="header-actions">
    <a class="back-link" href="/">&larr; Back to dashboard</a>
  </div>
</header>
<main>
  <div class="video-column" id="gate-camera-column">
    <p class="empty-state gate-camera-empty">No gate camera configured.</p>
  </div>
  <section class="panel admin-panel">
    <form class="add-form" id="add-form">
      <input id="plate-input" type="text" placeholder="Plate text (e.g. 5กค 9834)" required />
      <input id="label-input" type="text" placeholder="Label (optional, e.g. owner name)" />
      <button type="submit">Add</button>
    </form>
    <p class="form-error" id="form-error" hidden></p>
    <div class="panel-header">
      <h2>Registered</h2>
      <span class="count-badge" id="plates-count">0</span>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Plate</th>
            <th>Label</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="plates-body"></tbody>
      </table>
      <p class="empty-state" id="plates-empty">No registered plates yet.</p>
    </div>
  </section>
</main>
<section class="panel gate-activity-panel" id="gate-activity-panel" hidden>
  <div class="panel-header">
    <h2>Gate Activity</h2>
  </div>
  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Plate</th>
          <th>Label</th>
        </tr>
      </thead>
      <tbody id="gate-activity-body"></tbody>
    </table>
    <p class="empty-state" id="gate-activity-empty">No gate opens yet.</p>
  </div>
</section>
<script>
async function loadPlates() {
  let plates;
  try {
    const res = await fetch("/api/registered-plates");
    if (!res.ok) throw new Error(`Couldn't load registered plates (${res.status}).`);
    plates = await res.json();
  } catch (err) {
    showFormError(err.message || "Couldn't load registered plates -- try refreshing.");
    return;
  }
  const body = document.getElementById("plates-body");
  body.innerHTML = "";
  for (const p of plates) {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td class="plate">${p.plate_text}</td>
      <td>${p.label || ""}</td>
      <td><button class="remove-btn" data-plate="${p.plate_text}">Remove</button></td>
    `;
    body.appendChild(row);
  }
  document.getElementById("plates-count").textContent = plates.length;
  document.getElementById("plates-empty").style.display = plates.length ? "none" : "block";
}

const formError = document.getElementById("form-error");

function showFormError(message) {
  formError.textContent = message;
  formError.hidden = false;
}

function clearFormError() {
  formError.hidden = true;
}

document.getElementById("add-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearFormError();
  const plateInput = document.getElementById("plate-input");
  const labelInput = document.getElementById("label-input");
  const plate_text = plateInput.value.trim();
  if (!plate_text) return;

  const submitBtn = e.target.querySelector("button");
  submitBtn.disabled = true;
  submitBtn.textContent = "Adding…";
  try {
    const res = await fetch("/api/registered-plates", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ plate_text, label: labelInput.value.trim() || null }),
    });
    if (!res.ok) {
      const detail = await res.json().catch(() => null);
      throw new Error(detail?.detail || `Couldn't add this plate (${res.status}).`);
    }
    plateInput.value = "";
    labelInput.value = "";
    await loadPlates();
  } catch (err) {
    showFormError(err.message || "Couldn't add this plate -- try again.");
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Add";
  }
});

document.getElementById("plates-body").addEventListener("click", async (e) => {
  if (!e.target.matches(".remove-btn")) return;
  clearFormError();
  const btn = e.target;
  btn.disabled = true;
  try {
    const res = await fetch(`/api/registered-plates/${encodeURIComponent(btn.dataset.plate)}`, {
      method: "DELETE",
    });
    if (!res.ok) throw new Error(`Couldn't remove this plate (${res.status}).`);
    await loadPlates();
  } catch (err) {
    showFormError(err.message || "Couldn't remove this plate -- try again.");
    btn.disabled = false;
  }
});

loadPlates();

// A camera whose .env entry sets CAMERA_PAGE_N=admin (see app/config.py)
// exists to trigger the gate, not to be watched for detection quality --
// it's kept off the main monitoring dashboard and shown here instead.
// Self-contained (this page doesn't load app.js) since there's normally
// just the one gate camera; loosely mirrors setupCameras()/
// watchImageStream() in app.js for the reload-on-stall behavior.
async function setupGateCamera() {
  let cameras;
  try {
    const res = await fetch("/api/cameras");
    if (!res.ok) return;
    cameras = await res.json();
  } catch (err) {
    return;
  }
  const gateCameras = (cameras || []).filter((cam) => cam.page === "admin");
  if (gateCameras.length === 0) return; // leave the "No gate camera configured." message

  // A gate camera is configured -- so gate access control is a separate
  // thing from the monitoring dashboard, and the Gate Activity log below
  // is meaningful.
  document.getElementById("gate-activity-panel").hidden = false;

  const column = document.getElementById("gate-camera-column");
  column.innerHTML = "";
  // Same video-grid the detection page uses -- a single gate camera stays
  // full width, more than one would tile.
  const grid = document.createElement("div");
  grid.className = "video-grid" + (gateCameras.length > 1 ? "" : " single-camera");
  column.appendChild(grid);

  for (const cam of gateCameras) {
    const src = cam.id ? `/video_feed/${cam.id}` : "/video_feed";
    const panel = document.createElement("section");
    panel.className = "panel video-panel";
    panel.innerHTML = `
      ${gateCameras.length > 1 ? `<span class="camera-label">${cam.name}</span>` : ""}
      <img alt="${cam.name || "gate camera feed"}" />
      <span class="live-badge"><span class="live-dot"></span>LIVE</span>
    `;
    grid.appendChild(panel);

    const img = panel.querySelector("img");
    let lastFrameAt = Date.now();
    const reload = () => {
      lastFrameAt = Date.now();
      img.src = src + "?_=" + Date.now();
    };
    img.addEventListener("load", () => { lastFrameAt = Date.now(); });
    img.addEventListener("error", () => setTimeout(reload, 2000));
    setInterval(() => {
      if (Date.now() - lastFrameAt > 8000) reload();
    }, 3000);
    reload();
  }
}

setupGateCamera();

// Recent gate opens (registered plate matched at the gate camera) --
// polled rather than pushed since a gate opens infrequently and this page
// already polls /api/registered-plates.
async function loadGateActivity() {
  let events;
  try {
    const res = await fetch("/api/gate-events");
    if (!res.ok) return;
    events = await res.json();
  } catch (err) {
    return;
  }
  const body = document.getElementById("gate-activity-body");
  body.innerHTML = "";
  for (const e of events) {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${new Date(e.timestamp * 1000).toLocaleTimeString()}</td>
      <td class="plate">${e.plate_text} <span class="gate-open-tag">OPENED</span></td>
      <td>${e.label || ""}</td>
    `;
    body.appendChild(row);
  }
  document.getElementById("gate-activity-empty").style.display = events.length ? "none" : "block";
}

loadGateActivity();
setInterval(loadGateActivity, 4000);
</script>
</body>
</html>
